<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>AI 학교 허브</title>
<style>
:root{--bg:#f6f6f4;--fg:#1d1d1f;--sub:#6b6b70}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b1d;--fg:#f2f2f2;--sub:#a0a0a6}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,"Segoe UI","Malgun Gothic",sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 16px}
h1{font-size:20px;font-weight:600;margin:0 0 10px}p{color:var(--sub);font-size:14px;line-height:1.6;margin:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sub);margin:0 3px;animation:b 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes b{0%,80%,100%{opacity:.2}40%{opacity:1}}
#late{display:none;margin-top:18px}
</style></head><body><div>
<div style="margin-bottom:18px"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
<h1>허브를 켜는 중이에요</h1>
<p>준비되면 화면이 저절로 바뀌어요.</p>
<p id="late">오래 걸리고 있어요. 1분이 넘도록 그대로면 허브를 닫았다가 다시 켜 주세요.<br>그래도 같으면 컴퓨터를 한 번 다시 시작해 주세요.</p>
</div><script>setTimeout(function(){document.getElementById('late').style.display='block'},40000)</script></body></html>
